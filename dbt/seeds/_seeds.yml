version: 2

seeds:
  - name: plan_comptes
    description: >
      Plan de comptes simplifié à codes internes (cadrage phase 0), correspondances SYSCOHADA
      indicatives. v0.5 (H8) : rubrique_solde_inverse = rubrique où classer le compte si son solde
      est inversé (comptes de liaison non compensés, D13) ; vide pour les autres comptes.
    config:
      column_types:
        compte_sfd: text
        compte_syscohada_equiv: text
        rubrique_solde_inverse: text
    columns:
      - name: rubrique_solde_inverse
        description: Rubrique de reclassement d'un solde inversé (P3_DETTES_TRESORERIE pour les liaisons).
  - name: mapping_comptable
    description: Règles d'écriture par type d'événement (sens, compte, champ montant), dont APPRO_CAISSE (D18).
  - name: mapping_canal_tresorerie
    description: Compte de trésorerie et journal résolus selon le canal (@TRESORERIE).
  - name: journaux
    description: >
      Journaux comptables et leur priorité (D15). v0.4 : type_evenement = événement qui impose
      le journal (OUV pour OUVERTURE, VIR pour APPRO_CAISSE), vide sinon.
    config:
      column_types:
        code_journal: text
        libelle: text
        priorite: integer
        regle: text
        type_evenement: text
  - name: rubriques_etats
    description: >
      Libellés d'affichage des rubriques du bilan et du compte de résultat (K14, phase 8).
      Présentation seulement, pas de mapping comptable : un changement de libellé n'incrémente
      pas version_mapping.
    config:
      column_types:
        rubrique: text
        libelle: text
    columns:
      - name: rubrique
        description: Code de rubrique (plan de comptes, ou RESULTAT_CUMULE pour le bilan).
        data_tests: [unique, not_null]
      - name: libelle
        description: Libellé affiché dans les états financiers (UTF-8, accents et apostrophes).
        data_tests: [not_null]
  - name: canaux_autorises
    description: Canaux autorisés par source (D16) ; un canal absent → motif CANAL_NON_AUTORISE.
    columns:
      - name: source
        description: Source de l'événement (operations, remboursements, charges, ouverture).
      - name: canal
        description: Canal autorisé pour cette source.
