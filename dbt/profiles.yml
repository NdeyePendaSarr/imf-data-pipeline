# Profil dbt versionné : aucun secret, uniquement des variables d'environnement (.env).
# Lancer dbt via le Makefile (uv run --env-file .env …) pour charger le .env.
imf_dwh:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB_DWH', 'imf_dwh') }}"
      # Schéma par défaut ; generate_schema_name impose les schémas exacts silver / gold.
      schema: silver
      threads: 4
    # BigQuery (phase 9, bac à sable) : identifiants Google par défaut (ADC, gcloud auth
    # application-default login), aucune clé dans le dépôt. Projet et région lus dans .env ; les
    # datasets créés par dbt (silver, gold) prennent cette région (L5 : EU, jamais changée).
    # Sources bronze / audit : datasets du même projet, chargés par make load-bq.
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('BQ_PROJECT') }}"
      location: "{{ env_var('BQ_LOCATION') }}"
      # Dataset par défaut ; generate_schema_name impose les datasets exacts silver / gold.
      dataset: silver
      threads: 4
      priority: interactive
      # Garde-fou : une requête qui lirait plus de 1 Go échoue au lieu d'être facturée.
      maximum_bytes_billed: 1000000000
