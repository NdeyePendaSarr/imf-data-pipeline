version: 2

# Tests unitaires des marts : cas chiffrés de docs/cadrage/P1_cas_chiffres_tests.md, attendus
# recopiés tels quels (une seule agence AG_TEST ; cases vides du document = 0).
#   Section 2 → balance de janvier ; section 3 → balance de février ; section 4 → compte de résultat.
# Les écritures (section 1) sont données au grain de fct_ecritures ; leur jour dans le mois est
# indifférent pour des marts mensuels (15 du mois).

