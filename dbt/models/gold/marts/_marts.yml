version: 2

models:
  - name: mart_balance
    description: >
      Balance mensuelle à 6 colonnes (H5) : compte × agence × fin de mois de l'exercice ; solde
      d'ouverture D/C, mouvements D/C, solde de clôture D/C. Ouverture de janvier = 0 ;
      densification dès le premier mouvement (H6).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_fin_mois, code_compte, id_agence]
    columns:
      - name: date_fin_mois
        data_type: date
        description: Fin du mois de la balance.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: code_compte
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_compte_comptable')
                field: code_compte
      - name: id_agence
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agence')
                field: id_agence
      - name: solde_ouverture_debit
        data_type: bigint
        description: Solde débiteur au début du mois (= clôture débitrice du mois précédent ; 0 en janvier).
        data_tests: [not_null]
      - name: solde_ouverture_credit
        data_type: bigint
        description: Solde créditeur au début du mois.
        data_tests: [not_null]
      - name: mouvement_debit
        data_type: bigint
        description: Total des débits du mois.
        data_tests: [not_null]
      - name: mouvement_credit
        data_type: bigint
        description: Total des crédits du mois.
        data_tests: [not_null]
      - name: solde_cloture_debit
        data_type: bigint
        description: Solde débiteur en fin de mois (0 si le solde est créditeur).
        data_tests: [not_null]
      - name: solde_cloture_credit
        data_type: bigint
        description: Solde créditeur en fin de mois (0 si le solde est débiteur).
        data_tests: [not_null]
      - name: date_situation
        data_type: date
        description: Date de situation des montants — fin de mois, ou date d'arrêté pour le mois en cours (arrêté intermédiaire).
        data_tests: [not_null]

  - name: mart_compte_resultat
    description: >
      Compte de résultat (H9) : rubrique × fin de mois de l'exercice, montant du mois et cumul.
      Résultat = Σ resultat_* sur les rubriques = produits − charges (pas d'écriture de clôture).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_fin_mois, rubrique]
    columns:
      - name: date_fin_mois
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: rubrique
        data_type: text
        description: Rubrique du compte de résultat (R1 à R6 du plan de comptes).
        data_tests: [not_null]
      - name: type_rubrique
        data_type: text
        description: PRODUITS, CHARGES ou MIXTE, déduit de la nature des comptes de la rubrique.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PRODUITS, CHARGES, MIXTE]
      - name: montant_mois
        data_type: bigint
        description: Montant du mois dans le sens de la rubrique (produits C − D, charges D − C).
        data_tests: [not_null]
      - name: montant_cumul
        data_type: bigint
        description: Cumul depuis le 01/01, dans le sens de la rubrique.
        data_tests: [not_null]
      - name: resultat_mois
        data_type: bigint
        description: Contribution du mois au résultat (crédit − débit).
        data_tests: [not_null]
      - name: resultat_cumul
        data_type: bigint
        description: Contribution cumulée au résultat depuis le 01/01.
        data_tests: [not_null]
      - name: date_situation
        data_type: date
        description: Date de situation des montants — fin de mois, ou date d'arrêté pour le mois en cours (arrêté intermédiaire).
        data_tests: [not_null]

  - name: mart_bilan
    description: >
      Bilan simplifié au niveau de l'IMF (H7) : rubrique × fin de mois. Soldes sur mouvements
      cumulés agrégés de toutes les agences ; solde inversé reclassé dans rubrique_solde_inverse
      (H8) ; résultat cumulé (mart_compte_resultat) au passif. Actif = passif + résultat (test).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_fin_mois, rubrique]
    columns:
      - name: date_fin_mois
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: ordre
        data_type: integer
        description: Ordre de présentation dans le mois (A1, A2, P1, résultat, P2, P3).
        data_tests: [not_null]
      - name: cote
        data_type: text
        description: ACTIF ou PASSIF (le résultat cumulé est au passif).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ACTIF, PASSIF]
      - name: rubrique
        data_type: text
        description: Rubrique du bilan, ou RESULTAT_CUMULE.
        data_tests: [not_null]
      - name: montant
        data_type: bigint
        description: Montant de la rubrique en XOF (actif D − C, passif C − D ; résultat négatif si perte).
        data_tests: [not_null]
      - name: date_situation
        data_type: date
        description: Date de situation des montants — fin de mois, ou date d'arrêté pour le mois en cours (arrêté intermédiaire).
        data_tests: [not_null]

  - name: mart_rapprochements
    description: >
      Rapprochements gestion ↔ comptabilité (D9, H10) : fin de mois × agence × contrôle (DEPOTS,
      CREDITS), valeur de gestion, valeur comptable et écart (gestion − compta), attendu nul.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_fin_mois, id_agence, controle]
    columns:
      - name: date_fin_mois
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: id_agence
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agence')
                field: id_agence
      - name: controle
        data_type: text
        description: DEPOTS (dépôts de la clientèle) ou CREDITS (encours de crédit).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DEPOTS, CREDITS]
      - name: valeur_gestion
        data_type: bigint
        description: Σ soldes des comptes clients (DEPOTS) ou Σ encours (CREDITS) en fin de mois.
        data_tests: [not_null]
      - name: valeur_compta
        data_type: bigint
        description: Solde de clôture de DEPOTS_EPARGNE ou de CREDITS_SAINS dans mart_balance.
        data_tests: [not_null]
      - name: ecart
        data_type: bigint
        description: valeur_gestion − valeur_compta (attendu 0).
        data_tests: [not_null]
      - name: date_situation
        data_type: date
        description: Date de situation des montants — fin de mois, ou date d'arrêté pour le mois en cours (arrêté intermédiaire).
        data_tests: [not_null]

  - name: mart_kpi_portefeuille
    description: >
      KPI du portefeuille (H11) : jour calendaire × agence × produit. Numérateurs et dénominateurs
      seulement : PAR 30 = encours_par30 / encours ; taux de remboursement = paye_impute_cumule /
      du_echu_cumule (min par crédit avant agrégation, FIFO G11). Aucun ratio stocké.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, id_agence, code_produit]
    columns:
      - name: date
        data_type: date
        description: Jour calendaire de l'exercice.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: id_agence
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agence')
                field: id_agence
      - name: code_produit
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produit_credit')
                field: code_produit
      - name: nb_credits_actifs
        data_type: integer
        description: Crédits dont l'encours est > 0 ce jour-là.
        data_tests: [not_null]
      - name: encours
        data_type: bigint
        description: Σ capital restant dû (fct_portefeuille_quotidien).
        data_tests: [not_null]
      - name: encours_par30
        data_type: bigint
        description: Σ encours des crédits en retard de plus de 30 jours (numérateur du PAR 30).
        data_tests: [not_null]
      - name: du_echu_cumule
        data_type: bigint
        description: Σ capital + intérêts des échéances de date prévue ≤ jour, depuis le décaissement.
        data_tests: [not_null]
      - name: paye_impute_cumule
        data_type: bigint
        description: Σ par crédit de min(cumul payé capital + intérêts, dû échu cumulé) ; pénalités exclues.
        data_tests: [not_null]
