version: 2

# Test unitaire de fct_ecritures : exemple chiffré n° 1 du cadrage phase 0 §4.
#   1 Décaissement de 300 000 XOF            OD   CREDITS_SAINS D / DEPOTS_EPARGNE C
#   2 Frais de dossier de 6 000 XOF           OD   DEPOTS_EPARGNE D / PRODUIT_FRAIS_DOSSIER C
#   3 Dépôt guichet de 20 000 XOF             CAI  TRESO_CAISSE D / DEPOTS_EPARGNE C
#   4 Remboursement mobile de 30 000 XOF      MOB  TRESO_LIAISON_MM D / CREDITS_SAINS C 25 000,
#     (25 000 capital, 4 500 intérêts, 500 pénalités)    PRODUIT_INTERETS C 4 500, PRODUIT_PENALITES C 500
#   Total : 356 000 au débit = 356 000 au crédit, 4 pièces, 10 lignes.
# Les règles et canaux fournis sont ceux des seeds v0.5 pour ces quatre événements ; la règle
# DOTATION_DEPRECIATION (mvp = false) vérifie qu'une règle hors MVP n'est jamais appliquée.
# Le second cas du cadrage sera ajouté par Ndeye Penda.

unit_tests:
  - name: fct_ecritures_exemple_cadrage_1
    description: >
      Quatre événements de l'exemple n° 1 du cadrage → 4 pièces équilibrées (356 000 / 356 000),
      journaux OD, OD, CAI et MOB, @TRESORERIE résolu par le canal.
    model: fct_ecritures
    overrides:
      vars:
        version_mapping: v0.5
    given:
      - input: ref('int_evenements_comptables')
        rows:
          - {type_evenement: DECAISSEMENT, source_table: credits, source_id: CRD_TEST, date_evenement: 2025-03-03, id_agence: AG_TEST, canal: null, champ_montant: montant_accorde, montant: 300000}
          - {type_evenement: FRAIS_DOSSIER, source_table: credits, source_id: CRD_TEST, date_evenement: 2025-03-03, id_agence: AG_TEST, canal: null, champ_montant: frais_dossier, montant: 6000}
          - {type_evenement: DEPOT, source_table: operations, source_id: OPE_TEST, date_evenement: 2025-03-05, id_agence: AG_TEST, canal: GUICHET, champ_montant: montant, montant: 20000}
          - {type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, date_evenement: 2025-04-03, id_agence: AG_TEST, canal: MOBILE, champ_montant: montant_paye, montant: 30000}
          - {type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, date_evenement: 2025-04-03, id_agence: AG_TEST, canal: MOBILE, champ_montant: part_capital, montant: 25000}
          - {type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, date_evenement: 2025-04-03, id_agence: AG_TEST, canal: MOBILE, champ_montant: part_interets, montant: 4500}
          - {type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, date_evenement: 2025-04-03, id_agence: AG_TEST, canal: MOBILE, champ_montant: penalites, montant: 500}
      - input: ref('int_evenements_rejetes')
        rows: []
      - input: ref('mapping_comptable')
        rows:
          - {type_evenement: DECAISSEMENT, num_ligne: 1, sens: D, code_compte: CREDITS_SAINS, source: credits, champ_montant: montant_accorde, mvp: true}
          - {type_evenement: DECAISSEMENT, num_ligne: 2, sens: C, code_compte: DEPOTS_EPARGNE, source: credits, champ_montant: montant_accorde, mvp: true}
          - {type_evenement: FRAIS_DOSSIER, num_ligne: 1, sens: D, code_compte: DEPOTS_EPARGNE, source: credits, champ_montant: frais_dossier, mvp: true}
          - {type_evenement: FRAIS_DOSSIER, num_ligne: 2, sens: C, code_compte: PRODUIT_FRAIS_DOSSIER, source: credits, champ_montant: frais_dossier, mvp: true}
          - {type_evenement: DEPOT, num_ligne: 1, sens: D, code_compte: "@TRESORERIE", source: operations, champ_montant: montant, mvp: true}
          - {type_evenement: DEPOT, num_ligne: 2, sens: C, code_compte: DEPOTS_EPARGNE, source: operations, champ_montant: montant, mvp: true}
          - {type_evenement: REMBOURSEMENT, num_ligne: 1, sens: D, code_compte: "@TRESORERIE", source: remboursements, champ_montant: montant_paye, mvp: true}
          - {type_evenement: REMBOURSEMENT, num_ligne: 2, sens: C, code_compte: CREDITS_SAINS, source: remboursements, champ_montant: part_capital, mvp: true}
          - {type_evenement: REMBOURSEMENT, num_ligne: 3, sens: C, code_compte: PRODUIT_INTERETS, source: remboursements, champ_montant: part_interets, mvp: true}
          - {type_evenement: REMBOURSEMENT, num_ligne: 4, sens: C, code_compte: PRODUIT_PENALITES, source: remboursements, champ_montant: penalites, mvp: true}
          - {type_evenement: DOTATION_DEPRECIATION, num_ligne: 1, sens: D, code_compte: DOTATION_DEPRECIATION, source: credits, champ_montant: montant_accorde, mvp: false}
      - input: ref('mapping_canal_tresorerie')
        rows:
          - {canal: GUICHET, code_compte: TRESO_CAISSE, code_journal: CAI}
          - {canal: MOBILE, code_compte: TRESO_LIAISON_MM, code_journal: MOB}
          - {canal: PRELEVEMENT, code_compte: DEPOTS_EPARGNE, code_journal: OD}
      - input: ref('journaux')
        rows:
          - {code_journal: OUV, priorite: 1, type_evenement: OUVERTURE}
          - {code_journal: VIR, priorite: 1, type_evenement: APPRO_CAISSE}
          - {code_journal: CAI, priorite: 2, type_evenement: null}
          - {code_journal: MOB, priorite: 2, type_evenement: null}
          - {code_journal: OD, priorite: 3, type_evenement: null}
    expect:
      rows:
        - {id_ecriture: "credits:CRD_TEST:DECAISSEMENT", num_ligne: 1, date_ecriture: 2025-03-03, code_journal: OD, id_agence: AG_TEST, code_compte: CREDITS_SAINS, debit: 300000, credit: 0, type_evenement: DECAISSEMENT, source_table: credits, source_id: CRD_TEST, version_mapping: v0.5}
        - {id_ecriture: "credits:CRD_TEST:DECAISSEMENT", num_ligne: 2, date_ecriture: 2025-03-03, code_journal: OD, id_agence: AG_TEST, code_compte: DEPOTS_EPARGNE, debit: 0, credit: 300000, type_evenement: DECAISSEMENT, source_table: credits, source_id: CRD_TEST, version_mapping: v0.5}
        - {id_ecriture: "credits:CRD_TEST:FRAIS_DOSSIER", num_ligne: 1, date_ecriture: 2025-03-03, code_journal: OD, id_agence: AG_TEST, code_compte: DEPOTS_EPARGNE, debit: 6000, credit: 0, type_evenement: FRAIS_DOSSIER, source_table: credits, source_id: CRD_TEST, version_mapping: v0.5}
        - {id_ecriture: "credits:CRD_TEST:FRAIS_DOSSIER", num_ligne: 2, date_ecriture: 2025-03-03, code_journal: OD, id_agence: AG_TEST, code_compte: PRODUIT_FRAIS_DOSSIER, debit: 0, credit: 6000, type_evenement: FRAIS_DOSSIER, source_table: credits, source_id: CRD_TEST, version_mapping: v0.5}
        - {id_ecriture: "operations:OPE_TEST:DEPOT", num_ligne: 1, date_ecriture: 2025-03-05, code_journal: CAI, id_agence: AG_TEST, code_compte: TRESO_CAISSE, debit: 20000, credit: 0, type_evenement: DEPOT, source_table: operations, source_id: OPE_TEST, version_mapping: v0.5}
        - {id_ecriture: "operations:OPE_TEST:DEPOT", num_ligne: 2, date_ecriture: 2025-03-05, code_journal: CAI, id_agence: AG_TEST, code_compte: DEPOTS_EPARGNE, debit: 0, credit: 20000, type_evenement: DEPOT, source_table: operations, source_id: OPE_TEST, version_mapping: v0.5}
        - {id_ecriture: "remboursements:RMB_TEST:REMBOURSEMENT", num_ligne: 1, date_ecriture: 2025-04-03, code_journal: MOB, id_agence: AG_TEST, code_compte: TRESO_LIAISON_MM, debit: 30000, credit: 0, type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, version_mapping: v0.5}
        - {id_ecriture: "remboursements:RMB_TEST:REMBOURSEMENT", num_ligne: 2, date_ecriture: 2025-04-03, code_journal: MOB, id_agence: AG_TEST, code_compte: CREDITS_SAINS, debit: 0, credit: 25000, type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, version_mapping: v0.5}
        - {id_ecriture: "remboursements:RMB_TEST:REMBOURSEMENT", num_ligne: 3, date_ecriture: 2025-04-03, code_journal: MOB, id_agence: AG_TEST, code_compte: PRODUIT_INTERETS, debit: 0, credit: 4500, type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, version_mapping: v0.5}
        - {id_ecriture: "remboursements:RMB_TEST:REMBOURSEMENT", num_ligne: 4, date_ecriture: 2025-04-03, code_journal: MOB, id_agence: AG_TEST, code_compte: PRODUIT_PENALITES, debit: 0, credit: 500, type_evenement: REMBOURSEMENT, source_table: remboursements, source_id: RMB_TEST, version_mapping: v0.5}
