version: 2

models:
  - name: int_mouvements_compte
    description: >
      Mouvements des comptes clients (S10), une ligne par mouvement et une seule source par
      mouvement : DEPOT, RETRAIT, FRAIS_TENUE (slv_operations), DECAISSEMENT et FRAIS_DOSSIER
      (slv_credits, sur le compte d'épargne du crédit), PRELEVEMENT (slv_remboursements au canal
      PRELEVEMENT). Base des soldes de comptes et du rapprochement gestion ↔ comptabilité.
    config:
      contract:
        enforced: true
    columns:
      - name: id_mouvement
        data_type: string
        description: Identifiant déterministe et lisible, type_mouvement:source_id.
        data_tests:
          - unique
          - not_null
      - name: id_compte
        data_type: string
        description: Compte client mouvementé.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_comptes')
                field: id_compte
      - name: date
        data_type: date
        description: Jour du mouvement.
        data_tests:
          - not_null
      - name: type_mouvement
        data_type: string
        description: DEPOT, RETRAIT, FRAIS_TENUE, DECAISSEMENT, FRAIS_DOSSIER ou PRELEVEMENT.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DEPOT, RETRAIT, FRAIS_TENUE, DECAISSEMENT, FRAIS_DOSSIER, PRELEVEMENT]
      - name: montant_signe
        data_type: bigint
        description: Montant en XOF, positif s'il augmente le solde du compte, négatif sinon.
        data_tests:
          - not_null
      - name: source_table
        data_type: string
        description: Modèle silver d'origine (slv_operations, slv_credits, slv_remboursements).
      - name: source_id
        data_type: string
        description: Identifiant de la ligne d'origine dans source_table.

  - name: int_evenements_comptables
    description: >
      Événements comptables de l'exercice (G1, G2, G6, G7), depuis les slv_* : ouverture, appro_caisse,
      operations, credits (DECAISSEMENT et FRAIS_DOSSIER), remboursements, charges (CHARGE_<catégorie>).
      Format long : une ligne par événement et par champ montant (jointure avec mapping_comptable).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_table, source_id, type_evenement, champ_montant]
    columns:
      - name: type_evenement
        data_type: string
        description: Type d'événement du mapping comptable (DEPOT, REMBOURSEMENT, CHARGE_LOYERS…).
        data_tests: [not_null]
      - name: source_table
        data_type: string
        description: Source au sens de mapping_comptable (ouverture, appro_caisse, operations, credits, remboursements, charges).
        data_tests: [not_null]
      - name: source_id
        data_type: string
        description: Identifiant de la ligne source (agence|canal pour ouverture).
        data_tests: [not_null]
      - name: date_evenement
        data_type: date
        description: Date de l'événement (01/01 de l'exercice pour l'ouverture).
        data_tests: [not_null]
      - name: id_agence
        data_type: string
        description: Agence du client (operations, credits, remboursements) ou de la source.
        data_tests: [not_null]
      - name: canal
        data_type: string
        description: Canal de la source ; NULL pour appro_caisse et credits.
      - name: champ_montant
        data_type: string
        description: Colonne montant de la source (champ_montant de mapping_comptable).
        data_tests: [not_null]
      - name: montant
        data_type: bigint
        description: Montant du champ, en XOF.
        data_tests: [not_null]

  - name: int_evenements_rejetes
    description: >
      Événements non comptabilisables (G3), un motif par événement : TYPE_SANS_REGLE,
      CANAL_SANS_TRESORERIE ou COMPTE_HORS_PLAN. Seules les règles mvp comptent. Doit être vide.
    config:
      contract:
        enforced: true
    columns:
      - name: type_evenement
        data_type: string
      - name: source_table
        data_type: string
      - name: source_id
        data_type: string
      - name: motif
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [TYPE_SANS_REGLE, CANAL_SANS_TRESORERIE, COMPTE_HORS_PLAN]
