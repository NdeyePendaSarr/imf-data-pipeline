# Projet dbt de l'entrepôt imf_dwh : bronze (sources) → silver (phase 4) → gold (phase 5).
name: imf_dwh
version: "1.0.0"
profile: imf_dwh

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Exercice analysé (année civile). dim_date le couvre, ainsi que les 2 années suivantes où
  # tombent encore des échéances (crédits jusqu'à 24 mois décaissés en décembre).
  exercice: 2025
  annees_apres_exercice: 2
  # Version des règles comptables (seeds du cadrage), tracée sur chaque ligne d'écriture.
  version_mapping: 'v0.5'
  # Date d'arrêté (vide = 31/12 de l'exercice, macro date_arrete) : aucune date du gold au-delà.
  date_arrete: ''

flags:
  # Aucune statistique d'usage envoyée à dbt Labs.
  send_anonymous_usage_stats: false

models:
  imf_dwh:
    # PostgreSQL : statistiques calculées dès la création de chaque table, sans attendre
    # l'autovacuum. Sans elles, le planificateur estime à 1 ligne des jointures de plusieurs
    # dizaines de milliers (fct_ecritures : boucles imbriquées, > 9 min au lieu de 2 s). Vues et
    # BigQuery : rien à faire.
    +post-hook: >-
      {% if target.type == 'postgres' and config.get('materialized') == 'table' %}analyze {{ this }}{% endif %}
    silver:
      # Silver : tables reconstruites à chaque build, aucun incrémental (S14).
      +schema: silver
      +materialized: table
      staging:
        # Staging : vues de typage, standardisation et motif d'écart (S3).
        +materialized: view
      intermediate:
        +materialized: table

    gold:
      # Gold : dimensions et faits du schéma en étoile, tables reconstruites (S14).
      +schema: gold
      +materialized: table

seeds:
  imf_dwh:
    # Référentiels du cadrage (plan de comptes, mapping, canaux) dans le schéma silver (S2).
    +schema: silver
    # Recréés à chaque build : un changement de colonnes (journaux v0.4) ne demande plus de
    # --full-refresh manuel. Les vues qui en dépendent sont reconstruites dans le même build.
    +full_refresh: true
    # PostgreSQL : statistiques recalculées après chaque chargement. Les seeds (< 50 lignes)
    # restent sous le seuil de l'autovacuum ; sans statistiques, le planificateur estime à
    # 1 ligne la jointure événements × mapping_comptable et fct_ecritures passe en boucles
    # imbriquées (> 9 min au lieu de 2 s). BigQuery n'a pas d'équivalent ni de besoin.
    +post-hook: "{% if target.type == 'postgres' %}analyze {{ this }}{% endif %}"
    # Types de colonnes par moteur (L7) : text n'existe pas en BigQuery (string).
    canaux_autorises:
      +column_types:
        source: "{{ 'string' if target.type == 'bigquery' else 'text' }}"
        canal: "{{ 'string' if target.type == 'bigquery' else 'text' }}"
        commentaire: "{{ 'string' if target.type == 'bigquery' else 'text' }}"
