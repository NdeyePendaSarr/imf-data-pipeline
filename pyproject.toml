[project]
name = "imf-data-pipeline"
version = "0.1.0"
description = "Pipeline ELT et états financiers d'une IMF fictive (SenFinance Microcrédit)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Projet applicatif : pas de paquet Python à construire.
package = false
# uv sync / uv run installent aussi dbt (groupe séparé, cf. décision S1).
default-groups = ["dev", "dbt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
# Formateur ruff activé (remplace black).
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "generator", "ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests", "generator/tests", "ingestion/tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: tests nécessitant le PostgreSQL du projet (make up)",
    "slow: tests longs sur la configuration par défaut (exclus de make test)",
]
