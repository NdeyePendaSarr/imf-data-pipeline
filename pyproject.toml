[project]
name = "imf-data-pipeline"
version = "0.1.0"
description = "Pipeline ELT et états financiers d'une IMF fictive (SenFinance Microcrédit)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
bq = [
    "dbt-bigquery>=1.12.4",
    "google-cloud-bigquery>=3.47.0",
    "pyarrow>=26.0.1",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Projet applicatif : pas de paquet Python à construire.
package = false
# uv sync / uv run installent aussi dbt (groupe séparé, cf. décision S1) et BigQuery (groupe bq :
# google-cloud-bigquery, pyarrow, dbt-bigquery ; L11). Aucune dépendance Google dans le projet
# lui-même ; l'image Airflow n'installe que le groupe dbt (--no-default-groups --group dbt).
default-groups = ["dev", "dbt", "bq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
# Formateur ruff activé (remplace black).
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "generator", "ingestion", "airflow", "orchestration", "scripts"]

[[tool.mypy.overrides]]
# Airflow n'est installé que dans son image (phase 7), jamais dans le venv du projet : ses
# imports sont ignorés en local ; les DAG sont testés dans le conteneur (make test-airflow).
module = ["airflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Sans Airflow en local, ses décorateurs (@task, @teardown) sont non typés : seul le module du
# DAG est exempté de ce contrôle ; le reste du mode strict s'applique.
module = ["imf_quotidien"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pyarrow n'est pas typé (ni py.typed ni stubs publiés) : imports ignorés (chargeur BigQuery,
# phase 9). google-cloud-bigquery, lui, est typé.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "generator/tests", "ingestion/tests", "orchestration/tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: tests nécessitant le PostgreSQL du projet (make up)",
    "slow: tests longs sur la configuration par défaut (exclus de make test)",
    "airflow: tests lancés dans le conteneur Airflow (make test-airflow), exclus de la CI",
]
