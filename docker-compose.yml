# --- Airflow (phase 7) : profil « airflow », lancé par make airflow-up ; make up reste inchangé.
# Configuration commune aux services Airflow. Les secrets viennent de .env uniquement ; ils
# sont en ${VAR:-} pour que make up (sans profil) ne dépende pas d'eux, et airflow-init refuse
# de démarrer s'il en manque un.
x-airflow-commun: &airflow-commun
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: imf-airflow:3.3.2
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  working_dir: /opt/pipeline
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/pipeline/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-}
    # Un seul worker pour l'api-server (poste de développement).
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Exercice traité par le DAG imf_quotidien (début et fin du planning).
    IMF_EXERCICE: ${IMF_EXERCICE:-2025}
    # Connexion du pipeline à PostgreSQL (imf_ops, imf_dwh) : hôte = service postgres, port
    # interne ; mêmes variables que dbt/profiles.yml et l'ingestion.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    POSTGRES_DB_OPS: ${POSTGRES_DB_OPS:-imf_ops}
    POSTGRES_DB_DWH: ${POSTGRES_DB_DWH:-imf_dwh}
    # Artefacts dbt du conteneur, séparés de ceux du poste (dbt/target, dbt/logs).
    DBT_TARGET_PATH: /opt/airflow/dbt-run/target
    DBT_LOG_PATH: /opt/airflow/dbt-run/logs
    # Aucun __pycache__ écrit dans le dépôt monté en lecture seule.
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    # Dépôt monté en lecture seule (DAG, code du pipeline, projet dbt) ; seul data/ est en
    # écriture (landing de l'ingestion). dbt écrit target/ et logs/ hors du dépôt
    # (DBT_TARGET_PATH, DBT_LOG_PATH) ; le venv du projet reste dans l'image.
    - .:/opt/pipeline:ro
    - ./data:/opt/pipeline/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: imf-postgres
    restart: unless-stopped
    environment:
      # Identifiants lus depuis le fichier .env (jamais versionné)
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      # Base créée automatiquement : l'entrepôt
      POSTGRES_DB: imf_dwh
    ports:
      # 5433 par défaut : le port 5432 est déjà pris par un PostgreSQL local
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés au premier démarrage uniquement (volume vide)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d imf_dwh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de métadonnées d'Airflow, séparée de l'entrepôt.
  airflow-db:
    image: postgres:17
    container_name: imf-airflow-db
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Vérifie les secrets, migre la base Airflow, crée le compte administrateur, puis s'arrête.
  airflow-init:
    <<: *airflow-commun
    container_name: imf-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for v in AIRFLOW_DB_PASSWORD AIRFLOW_FERNET_KEY AIRFLOW_JWT_SECRET AIRFLOW_API_SECRET_KEY _AIRFLOW_WWW_USER_PASSWORD POSTGRES_USER POSTGRES_PASSWORD; do
          if [ -z "$${!v}" ]; then echo "Variable $$v manquante dans .env (voir .env.example)"; exit 1; fi
        done
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW_JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
      AIRFLOW_API_SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    mem_limit: 1g
    restart: "no"

  airflow-api-server:
    <<: *airflow-commun
    container_name: imf-airflow-api-server
    command: api-server
    ports:
      - "8080:8080"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-commun
    container_name: imf-airflow-scheduler
    command: scheduler
    # Pic mesuré : 685 Mio sur le backfill du trimestre (67 % de 1 Gio) ; marge pour l'année.
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-commun
    container_name: imf-airflow-dag-processor
    command: dag-processor
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-db-data:
  airflow-logs:
